<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Bard">
  <style>
    .ember { fill: #a8471b; }
    .glass { fill: #101018; }
    .line  { fill: #cfe6ff; }
    @media (prefers-color-scheme: dark) {
      .ember { fill: #e39b4f; }
      .glass { fill: #07080a; }
    }
  </style>
  <!-- the OLED: 72x40 proportions, the window the story moves past -->
  <rect class="glass" x="2" y="9" width="28" height="16" rx="2.5"/>
  <!-- five lines of text, the last one mid-word -->
  <g class="line" opacity=".9">
    <rect x="5" y="12"   width="18" height="1.6" rx=".8"/>
    <rect x="5" y="15.2" width="22" height="1.6" rx=".8"/>
    <rect x="5" y="18.4" width="14" height="1.6" rx=".8"/>
    <rect x="5" y="21.6" width="9"  height="1.6" rx=".8"/>
  </g>
  <!-- the sigil spark, still writing -->
  <path class="ember" d="M23.5 0.5 L25.1 5.4 L30 7 L25.1 8.6 L23.5 13.5 L21.9 8.6 L17 7 L21.9 5.4 Z"/>
</svg>
